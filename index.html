<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ინგლისური ნულიდან</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6fc;--card:#fff;--ink:#14213d;--mut:#5b6785;--acc:#2a6fdb;--ok:#1e8e5a;--bad:#c93c3c;--line:#d5deee;--sun:#ffc93c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1729;--card:#18233d;--ink:#eaf0ff;--mut:#9aa8c9;--acc:#6aa2ff;--ok:#4fd08f;--bad:#ff7b7b;--line:#2a3a5e}}
:root[data-theme="dark"]{--bg:#0f1729;--card:#18233d;--ink:#eaf0ff;--mut:#9aa8c9;--acc:#6aa2ff;--ok:#4fd08f;--bad:#ff7b7b;--line:#2a3a5e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 "Noto Sans Georgian",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 18px 60px}
h1{font-size:clamp(28px,6vw,42px);line-height:1.15;font-weight:800;margin:8px 0 6px}
h2{font-size:24px;margin:0 0 8px;font-weight:800}
p{margin:.4em 0}.mut{color:var(--mut)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:16px 0 26px}
.bar i{display:block;height:100%;background:var(--sun);transition:width .5s}
.lvl{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px;margin:12px 0;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.lvl .n{flex:none;width:52px;height:52px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
.lvl.done .n{background:var(--ok)}
.lvl.lock{opacity:.55;cursor:not-allowed}.lvl.lock .n{background:var(--mut)}
.lvl b{display:block;font-size:19px}
.box{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px 22px;margin:14px 0}
table{border-collapse:collapse;width:100%;margin:10px 0}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.en{font-weight:800;color:var(--acc)}
button.b{font:600 17px "Noto Sans Georgian",sans-serif;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 22px;cursor:pointer;margin:6px 8px 6px 0}
button.b.g{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible,label:focus-within{outline:3px solid var(--sun);outline-offset:2px}
.q{margin:20px 0}.q label{display:block;padding:10px 14px;border:2px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--card)}
.q input{margin-right:10px}
.res{font-size:44px;font-weight:800}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.foot{margin-top:40px;font-size:14px}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ==========================================================
   აქ შეგიძლია შეცვალო შინაარსი: დონეები, გაკვეთილები, კითხვები.
   ========================================================== */
const PASS = 70; // ჩასაბარებელი ზღვარი პროცენტებში

const LEVELS = [
 { title: "ანბანი და მისალმება",

    { title: "მისალმება",

      <tr><td class="en">Good evening</td><td>საღამო მშვიდობისა</td></tr>

    { title: "როგორ ხარ?",

    { q: "„ნახვამდის“ ინგლისურად არის:", o: ["Goodbye", "Hello", "Thank you"], a: 0 }

 { title: "რიცხვები და ფერები",

    { title: "რიცხვები 1–5",

      <tr><td class="en">three</td><td>3</td></tr><tr><td class="en">four</td><td>4</td></tr>

 { title: "ოჯახი",

    { title: "ოჯახის წევრები",

      <tr><td class="en">grandmother</td><td>ბებია</td></tr>
      <tr><td class="en">grandfather</td><td>ბაბუა</td></tr></table>` },

    { q: "„I have a sister.“ ნიშნავს:", o: ["მე მყავს და.", "მე მყავს ძმა.", "ეს ჩემი დედაა."], a: 0 }
   ] },
 { title: "თავი და სახე",

    { title: "ვარჯიში Quizlet-ით",

      <p>ეს ჩემი ოთახია. ის პატარაა, მაგრამ ძალიან ლამაზია. ოთახში არის დიდი საწოლი. ფანჯარასთან ახლოს არის ლამაზი მაგიდა. შეხედე! მაგიდაზე ბევრი წიგნი არის. ასევე არის ორი სკამი.</p>
      <p class="en">This is my friend’s room. It is big. There is a small bed in his room. There are two windows. Near the windows, there are a lot of flowers. There is a computer on the table, but there are no books.</p>
      <p>ეს ჩემი მეგობრის ოთახია. ის დიდია. მის ოთახში არის პატარა საწოლი. არის ორი ფანჯარა. ფანჯრებთან ახლოს არის ბევრი ყვავილი. მაგიდაზე არის კომპიუტერი, მაგრამ წიგნები არ არის.</p>

      <tr><td class="en">There are three windows in the room.</td><td>ოთახში არის სამი ფანჯარა.</td></tr>
      <tr><td class="en">There is a beautiful park near my house.</td><td>ჩემს სახლთან ახლოს არის ლამაზი პარკი.</td></tr>
      <tr><td class="en">There are a lot of cars in the city.</td><td>ქალაქში არის ბევრი მანქანა.</td></tr>
      <tr><td class="en">My room is small, but it is beautiful.</td><td>ჩემი ოთახი პატარაა, მაგრამ ლამაზია.</td></tr>

 { title: "მე ვარ სახლში",

    { title: "ახალი სიტყვები და ტექსტი",
      body: `<table><tr><td class="en">I am</td><td>მე ვარ</td></tr>

      <p class="en">I am at home. My house is beautiful. There is a big table in my room. A small bag is on the table. There are two pens in the bag.</p>
      <p>მე ვარ სახლში. ჩემი სახლი ლამაზია. ჩემს ოთახში არის დიდი მაგიდა. პატარა ჩანთა მაგიდაზეა. ჩანთაში არის ორი კალამი.</p>

      <p>ჩემი მეგობარიც სახლშია. ის მასწავლებელია. ჩვენ ბედნიერები ვართ ოთახში. შეხედე ფანჯრებს! ისინი დიდია.</p>

      <tr><td class="en">You are my friend.</td><td>შენ ხარ ჩემი მეგობარი.</td></tr>
      <tr><td class="en">He is happy today.</td><td>ის (მამრ.) ბედნიერია დღეს.</td></tr>
      <tr><td class="en">There is a pen near the book.</td><td>წიგნთან ახლოს არის კალამი.</td></tr>

const unlocked = i => i === 0 || passed.includes(i - 1);

function home() {

  }).join("") +
  `<p class="foot mut"><a href="#" onclick="reset();return false" style="color:inherit">პროგრესის განულება</a></p>`;
}

function level(i) {

  l.lessons.map((ls, j) => `<div class="box"><h2>${j + 1}. ${ls.title}</h2>${ls.body}</div>`).join("") +
  `<button class="b" onclick="test(${i})">დავიწყოთ საბოლოო ტესტი</button>`;
  window.scrollTo(0, 0);
}

  const l = LEVELS[i];
  app.innerHTML = `<h1>ტესტი: დონე ${i + 1}</h1><p class="mut">გადასასვლელად საჭიროა ${PASS}%.</p>
  <div>${l.test.map((t, k) => `<div class="q"><b>${k + 1}. ${t.q}</b>` +
    t.o.map((o, m) => `<label><input type="radio" name="q${k}" value="${m}">${o}</label>`).join("") + `</div>`).join("")}</div>
  <button class="b" onclick="grade(${i})">შედეგის ნახვა</button>
  <button class="b g" onclick="level(${i})">გაკვეთილებზე დაბრუნება</button>`;
  window.scrollTo(0, 0);
}

function grade(i) {
  const l = LEVELS[i];
  let ok = 0;
  l.test.forEach((t, k) => {
    const c = document.querySelector(`input[name="q${k}"]:checked`);
    if (c && +c.value === t.a) ok++;
  });
  const p = Math.round(ok / l.test.length * 100), win = p >= PASS;
  if (win && !passed.includes(i)) { passed.push(i); save(); }
  const last = i === LEVELS.length - 1;
  app.innerHTML = `<h1>შენი შედეგი</h1>
  <div class="res ${win ? "ok" : "bad"}">${p}%</div>
  <p>${ok} სწორი პასუხი ${l.test.length}-დან.</p>
  <p>${win ? (last ? "გილოცავ! ყველა დონე გაიარე." : "შესანიშნავია! შემდეგი დონე გაიხსნა.")
           : `ჯერ ვერ მიაღწიე ${PASS}%-ს. გადახედე გაკვეთილებს და სცადე თავიდან.`}</p>` +
  (win && !last ? `<button class="b" onclick="level(${i + 1})">შემდეგი დონე</button>` : "") +
  (win ? "" : `<button class="b" onclick="level(${i})">გაკვეთილების გამეორება</button><button class="b g" onclick="test(${i})">ტესტის თავიდან ცდა</button>`) +
  `<button class="b g" onclick="home()">დონეების სია</button>`;
  window.scrollTo(0, 0);
}

function reset() {
  if (confirm("დარწმუნებული ხარ? პროგრესი წაიშლება.")) { passed = []; save(); home(); }
}
home();
</script>
</body>
</html>
